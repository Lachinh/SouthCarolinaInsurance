<html lang="en">
<head>

<title>SC Care Price Finder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2040%2040%22%3E%3Cpath%20d%3D%22M20%203C20%203%2027.5%206.8%2032.5%207.4C33.7%207.5%2034.5%208.4%2034.5%209.6V20.5C34.5%2028.8%2028.2%2034.8%2020%2037.5C11.8%2034.8%205.5%2028.8%205.5%2020.5V9.6C5.5%208.4%206.3%207.5%207.5%207.4C12.5%206.8%2020%203%2020%203Z%22%20fill%3D%22%2310A56A%22/%3E%3Crect%20x%3D%2217.4%22%20y%3D%2212.5%22%20width%3D%225.2%22%20height%3D%2215%22%20rx%3D%222.2%22%20fill%3D%22%23fff%22/%3E%3Crect%20x%3D%2212.5%22%20y%3D%2217.4%22%20width%3D%2215%22%20height%3D%225.2%22%20rx%3D%222.2%22%20fill%3D%22%23fff%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF0EC;--surface:#FFFFFF;--ink:#0E1A16;--muted:#5A6863;--faint:#94A19B;
    --brand:#10A56A;--brand-dark:#0A7A4E;--brand-soft:#E4F5EC;
    --accent:#F0623E;--accent-soft:#FCE9E2;--good:#10A56A;--bad:#D2503A;
    --line:rgba(14,26,22,0.09);--line-2:rgba(14,26,22,0.16);
    --radius:22px;--radius-sm:15px;
    --shadow:0 2px 6px rgba(14,26,22,0.04), 0 20px 50px -28px rgba(14,26,22,0.32);
    --display:"Bricolage Grotesque",system-ui,sans-serif;--body:"Hanken Grotesk",system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.08;margin:0;letter-spacing:-0.02em;}
  button{font-family:inherit;cursor:pointer;}
  .wrap{max-width:1060px;margin:0 auto;padding:0 22px;}

  .topbar{position:sticky;top:0;z-index:50;background:rgba(238,240,236,0.82);backdrop-filter:saturate(160%) blur(14px);-webkit-backdrop-filter:saturate(160%) blur(14px);border-bottom:1px solid var(--line);}
  .topbar .wrap{display:flex;align-items:center;gap:14px;padding:13px 22px;}
  .brandmark{display:flex;align-items:center;gap:11px;font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-0.02em;color:var(--ink);background:none;border:none;padding:0;}
  .brandmark .dot{width:34px;height:34px;display:flex;align-items:center;justify-content:center;}
  .spacer{flex:1;}
  .lang{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;}
  .lang button{border:none;background:none;color:var(--muted);font-size:13px;font-weight:600;padding:6px 14px;border-radius:999px;transition:.15s;}
  .lang button.on{background:var(--ink);color:#fff;}

  .protobar{text-align:center;font-size:12.5px;padding:9px 22px;font-weight:600;letter-spacing:0.02em;color:var(--muted);}
  .protobar:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:middle;}

  .hero{text-align:center;padding:60px 0 10px;}
  .hero h1{font-size:clamp(38px,6vw,58px);font-weight:700;letter-spacing:-0.035em;margin-bottom:16px;}
  .hero p{font-size:19px;color:var(--muted);margin:0 auto;max-width:540px;line-height:1.5;}
  .searchwrap{max-width:680px;margin:34px auto 0;position:relative;}
  .searchwrap input{width:100%;height:64px;border-radius:18px;border:1px solid var(--line-2);background:var(--surface);padding:0 24px 0 58px;font-size:18px;font-family:inherit;color:var(--ink);box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s;}
  .searchwrap input::placeholder{color:var(--faint);}
  .searchwrap input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft);}
  .searchwrap .mag{position:absolute;left:22px;top:50%;transform:translateY(-50%);font-size:22px;color:var(--faint);}
  .controls{max-width:680px;margin:16px auto 0;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;}
  .toggle{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;}
  .toggle button{border:none;background:none;font-size:14px;font-weight:600;color:var(--muted);padding:10px 18px;border-radius:10px;transition:.15s;}
  .toggle button.on{background:var(--ink);color:#fff;}
  .selwrap{position:relative;}
  select{appearance:none;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 40px 12px 18px;cursor:pointer;transition:.15s;}
  select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft);}
  .selwrap .chev{position:absolute;right:16px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted);font-size:12px;}
  .popular{max-width:680px;margin:22px auto 0;text-align:center;}
  .popular .lbl{font-size:13px;color:var(--faint);font-weight:600;margin-right:6px;}
  .chip{display:inline-block;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600;margin:5px 4px;color:var(--ink);transition:.15s;}
  .chip:hover{border-color:var(--brand);color:var(--brand-dark);transform:translateY(-1px);}

  .browse{margin:56px 0 64px;}
  .browse .sec-lbl{text-align:center;font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:24px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;}
  .cat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;text-align:left;transition:transform .18s cubic-bezier(.2,.7,.2,1),border-color .18s,box-shadow .18s;opacity:0;animation:cardIn .5s cubic-bezier(.2,.7,.2,1) forwards;}
  .cat:hover{transform:translateY(-4px);border-color:transparent;box-shadow:var(--shadow);}
  .cat .ic{width:50px;height:50px;border-radius:15px;background:var(--brand-soft);color:var(--brand-dark);display:flex;align-items:center;justify-content:center;font-size:25px;margin-bottom:16px;transition:.18s;}
  .cat:hover .ic{background:var(--brand);color:#fff;}
  .cat h3{font-family:var(--body);font-size:17px;font-weight:700;letter-spacing:-0.01em;margin-bottom:4px;}
  .cat p{font-size:14px;color:var(--muted);margin:0;}

  .backbtn{display:inline-flex;align-items:center;gap:7px;background:none;border:none;color:var(--brand-dark);font-size:15px;font-weight:600;padding:28px 0 6px;transition:gap .15s;}
  .backbtn:hover{gap:11px;}
  .list-head{padding:8px 0 18px;border-bottom:1px solid var(--line);margin-bottom:22px;}
  .list-head h1{font-size:clamp(26px,4vw,36px);letter-spacing:-0.03em;}
  .list-head .meta{color:var(--muted);font-size:15px;margin-top:6px;}

  .svclist{display:flex;flex-direction:column;gap:12px;}
  .svc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:16px;width:100%;text-align:left;transition:transform .15s cubic-bezier(.2,.7,.2,1),border-color .15s,box-shadow .15s;opacity:0;animation:cardIn .5s cubic-bezier(.2,.7,.2,1) forwards;}
  .svc:hover{transform:translateY(-2px);border-color:transparent;box-shadow:var(--shadow);}
  .svc h3{font-family:var(--body);font-size:17px;font-weight:700;letter-spacing:-0.01em;margin-bottom:5px;}
  .svc .code{display:inline-block;background:var(--ink);color:#fff;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:7px;letter-spacing:0.02em;}
  .svc .from{text-align:right;white-space:nowrap;}
  .svc .from .v{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-0.03em;color:var(--brand-dark);}
  .svc .from small{display:block;font-size:11.5px;color:var(--faint);font-weight:600;}

  .res-head{padding:8px 0 20px;border-bottom:1px solid var(--line);margin-bottom:24px;}
  .res-head h1{font-size:clamp(28px,4vw,38px);letter-spacing:-0.03em;margin-bottom:8px;}
  .res-head .meta{color:var(--muted);font-size:15px;}
  .res-head .code{display:inline-block;background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:4px 11px;border-radius:8px;margin-left:10px;vertical-align:middle;letter-spacing:0.02em;}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:18px 20px;}
  .stat .k{font-size:13px;color:var(--muted);font-weight:600;}
  .stat .v{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-0.03em;margin-top:3px;}
  .stat.lo .v{color:var(--good);} .stat.hi .v{color:var(--bad);}
  .provlist{display:flex;flex-direction:column;gap:14px;}
  .prov{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;text-align:left;transition:transform .16s cubic-bezier(.2,.7,.2,1),border-color .16s,box-shadow .16s;width:100%;opacity:0;animation:cardIn .5s cubic-bezier(.2,.7,.2,1) forwards;}
  .prov:hover{transform:translateY(-3px);border-color:transparent;box-shadow:var(--shadow);}
  .prov .row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;}
  .prov h3{font-family:var(--body);font-size:18px;font-weight:700;letter-spacing:-0.01em;margin-bottom:6px;}
  .prov .sub{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .badge{font-size:12px;font-weight:600;padding:3px 10px;border-radius:8px;}
  .badge.hosp{background:#EAEEEC;color:#4a5a56;} .badge.out{background:var(--brand-soft);color:var(--brand-dark);} .badge.best{background:var(--ink);color:#fff;}
  .prov .price{font-family:var(--display);font-size:27px;font-weight:700;letter-spacing:-0.03em;text-align:right;white-space:nowrap;}
  .prov .price.lo{color:var(--good);} .prov .price.hi{color:var(--bad);}
  .prov .price small{display:block;font-family:var(--body);font-size:12px;font-weight:600;color:var(--faint);margin-top:2px;}
  .bar{height:8px;border-radius:99px;background:#E7EBE9;margin-top:18px;overflow:hidden;}
  .bar i{display:block;height:8px;border-radius:99px;background:var(--brand);transition:width .5s cubic-bezier(.2,.7,.2,1);}
  .bar i.lo{background:var(--good);} .bar i.hi{background:var(--bad);}
  .gocue{font-size:13px;color:var(--brand-dark);font-weight:600;margin-top:14px;display:flex;align-items:center;gap:5px;opacity:.85;}

  .det-head{padding:8px 0 24px;}
  .det-head h1{font-size:clamp(26px,4vw,36px);letter-spacing:-0.03em;margin-bottom:8px;}
  .det-head .meta{color:var(--muted);font-size:15px;}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:28px 30px;margin-bottom:18px;}
  .panel h2{font-size:22px;letter-spacing:-0.02em;margin-bottom:6px;}
  .panel .lede{color:var(--muted);font-size:15px;margin:0 0 22px;}
  .pricetag{font-family:var(--display);font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-0.02em;}
  .slider{display:flex;align-items:center;gap:18px;margin-bottom:18px;}
  .slider label{font-size:15px;color:var(--muted);font-weight:500;width:210px;}
  .slider input[type=range]{flex:1;accent-color:var(--brand);height:6px;}
  .slider .out{font-family:var(--display);font-size:17px;font-weight:700;width:74px;text-align:right;letter-spacing:-0.02em;}
  .estbox,.cashbox{background:var(--ink);border-radius:var(--radius-sm);padding:26px;text-align:center;margin-top:8px;}
  .estbox .k,.cashbox .k{font-size:14px;color:rgba(255,255,255,0.6);font-weight:600;}
  .estbox .v{font-family:var(--display);font-size:52px;font-weight:700;color:#fff;line-height:1.05;margin:6px 0 4px;letter-spacing:-0.04em;}
  .estbox .bd{font-size:13px;color:rgba(255,255,255,0.6);}
  .cashbox .v{font-family:var(--display);font-size:52px;font-weight:700;color:#FFB59B;margin:6px 0 4px;letter-spacing:-0.04em;}
  .ask{list-style:none;padding:0;margin:0;}
  .ask li{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line);font-size:15.5px;}
  .ask li:last-child{border-bottom:none;}
  .ask .q{width:26px;height:26px;border-radius:50%;background:var(--brand-soft);color:var(--brand-dark);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
  .qual{display:flex;gap:14px;align-items:flex-start;background:var(--brand-soft);border-radius:var(--radius-sm);padding:20px 22px;}
  .qual .ic{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .qual p{margin:0;color:var(--brand-dark);font-size:15.5px;}
  .note{font-size:13px;color:var(--faint);line-height:1.6;margin-top:16px;display:flex;gap:8px;}
  .errbar{background:var(--accent-soft);color:#8a3d1f;border-radius:14px;padding:16px 20px;font-size:14px;font-weight:600;line-height:1.5;max-width:680px;margin:24px auto;}
  .footer{text-align:center;color:var(--faint);font-size:13px;padding:36px 0 56px;}

  .hidden{display:none;}
  .reveal{animation:viewIn .5s cubic-bezier(.2,.7,.2,1);}
  @keyframes viewIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  @keyframes cardIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
  .cat:nth-child(1),.prov:nth-child(1),.svc:nth-child(1){animation-delay:.02s;}
  .cat:nth-child(2),.prov:nth-child(2),.svc:nth-child(2){animation-delay:.05s;}
  .cat:nth-child(3),.prov:nth-child(3),.svc:nth-child(3){animation-delay:.08s;}
  .cat:nth-child(4),.prov:nth-child(4),.svc:nth-child(4){animation-delay:.11s;}
  .cat:nth-child(5),.prov:nth-child(5),.svc:nth-child(5){animation-delay:.14s;}
  .cat:nth-child(6),.prov:nth-child(6),.svc:nth-child(6){animation-delay:.17s;}
  .prov:nth-child(n+7),.svc:nth-child(n+7){animation-delay:.20s;}
  @media(max-width:620px){
    .hero{padding:44px 0 6px;} .stats{grid-template-columns:1fr;}
    .slider label{width:140px;font-size:14px;} .slider{gap:12px;}
    .prov .price{font-size:23px;} .estbox .v,.cashbox .v{font-size:42px;} .panel{padding:22px 20px;}
  }
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}.cat,.prov,.svc{opacity:1!important;}}
</style>
</head>
<body>

<div class="topbar"><div class="wrap">
  <button class="brandmark" onclick="goHome()">
    <span class="dot"><svg width="34" height="34" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M20 3C20 3 27.5 6.8 32.5 7.4C33.7 7.5 34.5 8.4 34.5 9.6V20.5C34.5 28.8 28.2 34.8 20 37.5C11.8 34.8 5.5 28.8 5.5 20.5V9.6C5.5 8.4 6.3 7.5 7.5 7.4C12.5 6.8 20 3 20 3Z" fill="#10A56A"/><rect x="17.4" y="12.5" width="5.2" height="15" rx="2.2" fill="#fff"/><rect x="12.5" y="17.4" width="15" height="5.2" rx="2.2" fill="#fff"/></svg></span>
    <span id="brand-name">SC Care Price Finder</span>
  </button>
  <span class="spacer"></span>
  <div class="lang">
    <button id="lang-en" class="on" onclick="setLang('en')">EN</button>
    <button id="lang-es" onclick="setLang('es')">ES</button>
  </div>
</div></div>
<div class="protobar" id="proto-banner"></div>

<div id="view-home">
  <div class="wrap">
    <div class="hero">
      <h1 id="h-title"></h1>
      <p id="h-sub"></p>
      <div class="searchwrap"><span class="mag">&#9906;</span>
        <input id="search" type="text">
      </div>
      <div class="controls">
        <div class="toggle">
          <button id="t-ins" class="on" onclick="setMode('ins')"></button>
          <button id="t-cash" onclick="setMode('cash')"></button>

          <select id="region">
            <option value="mid">Midlands (Columbia area)</option>

    <div class="browse">

      <div id="cat-area"><div class="cards" id="cat-cards"></div></div>
    </div>
  </div>
</div>

<div id="view-list" class="hidden"><div class="wrap">
  <button class="backbtn" onclick="goHome()">&#8249; <span id="back-home"></span></button>
  <div class="list-head"><h1 id="list-title"></h1><div class="meta" id="list-meta"></div></div>
  <div class="svclist" id="svc-list"></div>
</div></div>

<div id="view-results" class="hidden"><div class="wrap">
  <button class="backbtn" onclick="resultsBack()">&#8249; <span id="back-res"></span></button>
  <div class="res-head"><h1 id="res-name"></h1><div class="meta" id="res-meta"></div></div>
  <div class="stats" id="res-stats"></div>
  <div class="provlist" id="res-list"></div>
  <p class="note" id="res-note"></p>
</div></div>

<div id="view-detail" class="hidden"><div class="wrap">
  <button class="backbtn" onclick="goResults()">&#8249; <span id="back-res2"></span></button>
  <div class="det-head"><h1 id="det-name"></h1><div class="meta" id="det-meta"></div></div>
  <div class="panel" id="det-cost"></div>
  <div class="panel"><h2 id="ask-title"></h2><ul class="ask" id="ask-list"></ul></div>
  <div class="panel"><div class="qual"><span class="ic">&#10003;</span><p id="qual-text"></p></div></div>
</div></div>

<div class="footer" id="foot"></div>

 es:{brand:"Buscador de Precios de Salud SC",title:"\u00BFCu\u00E1nto cuesta en Carolina del Sur?",
  sub:"Compara precios de an\u00E1lisis, estudios y procedimientos cerca de ti \u2014 antes de ir.",
  search:"Prueba un servicio o c\u00F3digo, p.ej. \u201Crodilla\u201D o \u201C73721\u201D",
  ins:"Tengo seguro",cash:"Pago en efectivo",popLbl:"Populares:",browseLbl:"Explorar por categor\u00EDa",
  backHome:"Volver a buscar",backRes:"Volver a resultados",
  lowest:"M\u00E1s bajo cerca de ti",median:"Mediana del \u00E1rea",highest:"M\u00E1s alto cerca de ti",
  near:"proveedores cerca de ti",insPrice:"precio con seguro",cashWord:"efectivo",cheapest:"Precio m\u00E1s bajo",goCue:"Ver tu costo",
  from:"desde",services:"servicios",allServices:"Todos los servicios",resultsFor:"Resultados para",
  noMatch:"Sin coincidencia exacta \u2014 mostrando todos los servicios",
  outp:"Centro ambulatorio",hospital:"Hospital",
  estTitle:"\u00BFCu\u00E1nto pagar\u00E9 realmente?",estLede:"Tu precio con seguro es",
  dedLabel:"Deducible que falta por cubrir",coinLabel:"Tu coaseguro despu\u00E9s de eso",
  estK:"Pagar\u00EDas aproximadamente",towardDed:"para el deducible",coins:"coaseguro",
  fullDed:"El precio completo cuenta para tu deducible",
  cashK:"Tu precio en efectivo",cashLede:"\u00BFPagas sin seguro? Este es el precio que pagar\u00EDas directamente a este proveedor.",
  estNote:"Solo una estimaci\u00F3n. Pagas el precio completo hasta cubrir tu deducible, luego tu parte del coaseguro. No incluye un posible m\u00E1ximo de gastos ya alcanzado.",
  askTitle:"Preguntas que debes hacer al reservar",
  ask:["\u00BFEs el precio total, o habr\u00E1 un cargo de instalaci\u00F3n aparte?",
       "\u00BFIncluye el precio al m\u00E9dico que interpreta los resultados?",
       "\u00BFCu\u00E1l es su precio en efectivo si no uso seguro?",
       "\u00BFEst\u00E1 este lugar dentro de la red de mi plan?"],
  qual:"Para estudios y an\u00E1lisis est\u00E1ndar, un precio m\u00E1s bajo no significa menor calidad. La misma prueba sigue las mismas normas en todas partes. Un centro ambulatorio cercano suele ser mucho m\u00E1s barato que un hospital por el mismo servicio.",
  resNote:"Los precios con seguro son tarifas negociadas. Tu costo real depende de tu deducible y coaseguro.",
  resNoteCash:"Los precios en efectivo son tarifas de pago propio. Confirma siempre el precio al reservar.",
  foot:"Prototipo de alfabetizaci\u00F3n en salud \u2022 Datos sint\u00E9ticos de ejemplo \u2022 No es consejo m\u00E9dico ni financiero",
  errLoad:"No se pudieron cargar los datos. Si abriste este archivo directamente, el navegador bloquea la carga de data.json. S\u00FAbelo a GitHub Pages (o usa un servidor local) y funcionar\u00E1.",
  pop:["Resonancia de rodilla","Mamograf\u00EDa","An\u00E1lisis A1C","Colonoscopia"]}
};
const CATS=[
 {id:"imaging",ic:"\u25C9",en:["Imaging","MRI, CT, X-ray, ultrasound"],es:["Estudios","Resonancia, TC, rayos X"]},
 {id:"lab",ic:"\u2697",en:["Lab tests","Bloodwork, screenings"],es:["Laboratorio","An\u00E1lisis de sangre"]},
 {id:"visit",ic:"\u271A",en:["Office visits","Checkups, specialists"],es:["Consultas","Chequeos, especialistas"]},
 {id:"procedure",ic:"\u2295",en:["Procedures","Colonoscopy, surgery"],es:["Procedimientos","Colonoscopia, cirug\u00EDa"]},
 {id:"pregnancy",ic:"\u2740",en:["Pregnancy","Prenatal, delivery"],es:["Embarazo","Prenatal, parto"]},
 {id:"all",ic:"\u22EF",en:["See all","Full list of services"],es:["Ver todo","Lista completa"]}
];
const REGION_NAMES={en:{mid:"the Midlands",up:"the Upstate",low:"the Lowcountry",pd:"the Pee Dee",all:"South Carolina"},
 es:{mid:"Midlands",up:"Upstate",low:"Lowcountry",pd:"Pee Dee",all:"Carolina del Sur"}};
const POP_IDS=["mri_knee","mammo_screen","a1c","colonoscopy"];

let lang="en",mode="ins",region="mid";
let SERVICES={},DATA={},ORDER=[];
let curList=[],curService=null,curProvider=null;
let listIds=[],listTitle="",resultsFrom="home";

const $=id=>document.getElementById(id);
const money=n=>"$"+Math.round(n).toLocaleString();

async function init(){
  renderChrome();
  try{
    const res=await fetch("data.json");
    if(!res.ok) throw new Error("http");
    const data=await res.json();
    data.services.forEach(s=>{
      SERVICES[s.id]={name:{en:s.name_en,es:s.name_es},code:s.code,cat:s.category};
      DATA[s.id]=s.providers.map(p=>[p.name,p.region,p.type,p.distance,p.insurance,p.cash]);
      ORDER.push(s.id);
    });
    renderCats();
  }catch(e){
    $("cat-area").innerHTML='<div class="errbar">'+T[lang].errLoad+'</div>';
  }
}
function renderChrome(){
  const t=T[lang];
  $("brand-name").textContent=t.brand;$("proto-banner").textContent=t.foot.split("\u2022")[1].trim();
  $("h-title").textContent=t.title;$("h-sub").textContent=t.sub;$("search").placeholder=t.search;
  $("t-ins").textContent=t.ins;$("t-cash").textContent=t.cash;$("pop-lbl").textContent=t.popLbl;
  $("browse-lbl").textContent=t.browseLbl;$("back-home").textContent=t.backHome;
  $("back-res").textContent=t.backRes;$("back-res2").textContent=t.backRes;
  $("ask-title").textContent=t.askTitle;$("foot").textContent=t.foot;
  $("pop-chips").innerHTML=t.pop.map((p,i)=>`<span class="chip" onclick="openService('${POP_IDS[i]}','home')">${p}</span>`).join("");
}
function renderCats(){
  $("cat-area").innerHTML='<div class="cards" id="cat-cards"></div>';
  $("cat-cards").innerHTML=CATS.map(c=>`<button class="cat" onclick="openCategory('${c.id}')"><div class="ic">${c.ic}</div><h3>${c[lang][0]}</h3><p>${c[lang][1]}</p></button>`).join("");
}
function svcLowest(id){
  let rows=DATA[id].filter(p=>region==="all"||p[1]===region);
  if(!rows.length) rows=DATA[id];
  const idx=mode==="ins"?4:5;
  return Math.min(...rows.map(p=>p[idx]));
}
function openCategory(cat){
  const t=T[lang];
  if(cat==="all"){listIds=ORDER.slice();listTitle=t.allServices;}
  else{listIds=ORDER.filter(id=>SERVICES[id].cat===cat);
       const c=CATS.find(x=>x.id===cat);listTitle=c?c[lang][0]:cat;}
  showList();
}
function openSearch(q){
  const t=T[lang];q=q.trim().toLowerCase();
  if(!q){openCategory("all");return;}
  const m=ORDER.filter(id=>SERVICES[id].name[lang].toLowerCase().includes(q)||
    SERVICES[id].name.en.toLowerCase().includes(q)||SERVICES[id].code.toLowerCase().includes(q));
  if(m.length===1){openService(m[0],"home");return;}
  if(m.length>1){listIds=m;listTitle=`${t.resultsFor} \u201C${q}\u201D`;showList();return;}
  listIds=ORDER.slice();listTitle=t.noMatch;showList();
}
function showList(){
  const t=T[lang];
  $("list-title").textContent=listTitle;
  $("list-meta").textContent=`${listIds.length} ${t.services} \u00B7 ${REGION_NAMES[lang][region]}`;
  $("svc-list").innerHTML=listIds.map(id=>{
    const s=SERVICES[id];
    return `<button class="svc" onclick="openService('${id}','list')"><div><h3>${s.name[lang]}</h3><span class="code">${s.code}</span></div><div class="from"><div class="v">${money(svcLowest(id))}</div><small>${t.from}</small></div></button>`;
  }).join("");
  show("view-list");
}
function buildList(){
  let list=DATA[curService].filter(p=>region==="all"||p[1]===region);
  if(!list.length) list=DATA[curService].slice();
  const idx=mode==="ins"?4:5;
  list.sort((a,b)=>a[idx]-b[idx]);
  curList=list;
}
function openService(id,from){
  curService=id;resultsFrom=from||"home";buildList();renderResults();show("view-results");
}
function renderResults(){
  const t=T[lang],s=SERVICES[curService],idx=mode==="ins"?4:5;
  $("res-name").innerHTML=s.name[lang]+`<span class="code">${s.code}</span>`;
  $("res-meta").textContent=`${curList.length} ${t.near} \u00B7 ${REGION_NAMES[lang][region]} \u00B7 ${mode==="ins"?t.ins:t.cash}`;
  const prices=curList.map(p=>p[idx]);
  const lo=Math.min(...prices),hi=Math.max(...prices);
  const med=prices.slice().sort((a,b)=>a-b)[Math.floor(prices.length/2)];
  $("res-stats").innerHTML=`<div class="stat lo"><div class="k">${t.lowest}</div><div class="v">${money(lo)}</div></div><div class="stat"><div class="k">${t.median}</div><div class="v">${money(med)}</div></div><div class="stat hi"><div class="k">${t.highest}</div><div class="v">${money(hi)}</div></div>`;
  $("res-list").innerHTML=curList.map((p,i)=>{
    const price=p[idx],alt=mode==="ins"?p[5]:p[4];
    const pct=Math.max(6,Math.round((price/hi)*100));
    const isLo=price===lo,isHi=price===hi&&hi!==lo,cls=isLo?"lo":(isHi?"hi":"");
    const tb=p[2]==="out"?`<span class="badge out">${t.outp}</span>`:`<span class="badge hosp">${t.hospital}</span>`;
    const bb=isLo?`<span class="badge best">${t.cheapest}</span>`:"";
    const al=mode==="ins"?t.cashWord:t.insPrice;
    return `<button class="prov" onclick="openProvider(${i})"><div class="row"><div><h3>${p[0]}</h3><div class="sub">${tb} ${bb} <span>\u00B7 ${p[3]} mi</span></div></div><div class="price ${cls}">${money(price)}<small>${al} ${money(alt)}</small></div></div><div class="bar"><i class="${cls}" style="width:${pct}%"></i></div><div class="gocue">${t.goCue} \u203A</div></button>`;
  }).join("");
  $("res-note").innerHTML="\u24D8&nbsp; "+(mode==="ins"?t.resNote:t.resNoteCash);
}
function openProvider(i){curProvider=curList[i];renderDetail();show("view-detail");}
function renderDetail(){
  const t=T[lang],s=SERVICES[curService],p=curProvider,insP=p[4],cashP=p[5];
  $("det-name").textContent=s.name[lang];
  $("det-meta").textContent=`${p[0]} \u00B7 ${p[3]} mi \u00B7 ${p[2]==="out"?t.outp:t.hospital}`;
  if(mode==="cash"){
    $("det-cost").innerHTML=`<h2>${t.cashK}</h2><p class="lede">${t.cashLede}</p><div class="cashbox"><div class="k">${t.cashK}</div><div class="v">${money(cashP)}</div></div><p class="note">\u24D8&nbsp; ${t.resNoteCash}</p>`;
  }else{
    $("det-cost").innerHTML=`<h2>${t.estTitle}</h2><p class="lede">${t.estLede} <span class="pricetag">${money(insP)}</span></p><div class="slider"><label for="ded">${t.dedLabel}</label><input type="range" id="ded" min="0" max="2500" step="50" value="800"><span class="out" id="ded-out">$800</span></div><div class="slider"><label for="coin">${t.coinLabel}</label><input type="range" id="coin" min="0" max="50" step="5" value="20"><span class="out" id="coin-out">20%</span></div><div class="estbox"><div class="k">${t.estK}</div><div class="v" id="oop"></div><div class="bd" id="bd"></div></div><p class="note">\u24D8&nbsp; ${t.estNote}</p>`;
    wireEst(insP);
  }
  $("ask-list").innerHTML=t.ask.map(a=>`<li><span class="q">?</span><span>${a}</span></li>`).join("");
  $("qual-text").textContent=t.qual;
}
function wireEst(price){
  const t=T[lang],ded=$("ded"),coin=$("coin");
  function c(){
    const d=+ded.value,cc=+coin.value/100;
    $("ded-out").textContent=money(d);$("coin-out").textContent=Math.round(cc*100)+"%";
    const tw=Math.min(d,price),af=Math.max(0,price-d),cp=af*cc,tot=tw+cp;
    $("oop").textContent=money(tot);
    $("bd").textContent=af>0?`${money(tw)} ${t.towardDed} + ${money(cp)} ${t.coins}`:t.fullDed;
  }
  ded.addEventListener("input",c);coin.addEventListener("input",c);c();
}
function show(v){
  ["view-home","view-list","view-results","view-detail"].forEach(id=>$(id).classList.add("hidden"));
  const el=$(v);el.classList.remove("hidden");el.classList.remove("reveal");void el.offsetWidth;el.classList.add("reveal");
}
function goHome(){show("view-home");window.scrollTo(0,0);}
function goResults(){show("view-results");window.scrollTo(0,0);}
function resultsBack(){resultsFrom==="list"?showList():goHome();}
function setLang(l){
  lang=l;$("lang-en").classList.toggle("on",l==="en");$("lang-es").classList.toggle("on",l==="es");
  renderChrome();if(ORDER.length)renderCats();
  if(!$("view-list").classList.contains("hidden"))showList();
  if(!$("view-results").classList.contains("hidden"))renderResults();
  if(!$("view-detail").classList.contains("hidden"))renderDetail();
}
function setMode(m){
  mode=m;$("t-ins").classList.toggle("on",m==="ins");$("t-cash").classList.toggle("on",m==="cash");
  if(!$("view-list").classList.contains("hidden"))showList();
  if(!$("view-results").classList.contains("hidden")){buildList();renderResults();}
}
$("region").addEventListener("change",e=>{
  region=e.target.value;
  if(!$("view-list").classList.contains("hidden"))showList();
  if(!$("view-results").classList.contains("hidden")){buildList();renderResults();}
});
$("search").addEventListener("keydown",e=>{if(e.key==="Enter")openSearch(e.target.value);});
init();
</script>
</body>
</html>
