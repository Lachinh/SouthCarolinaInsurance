<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SC Care Price Finder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2040%2040%22%3E%3Cpath%20d%3D%22M20%203C20%203%2027.5%206.8%2032.5%207.4C33.7%207.5%2034.5%208.4%2034.5%209.6V20.5C34.5%2028.8%2028.2%2034.8%2020%2037.5C11.8%2034.8%205.5%2028.8%205.5%2020.5V9.6C5.5%208.4%206.3%207.5%207.5%207.4C12.5%206.8%2020%203%2020%203Z%22%20fill%3D%22%2310A56A%22/%3E%3Crect%20x%3D%2217.4%22%20y%3D%2212.5%22%20width%3D%225.2%22%20height%3D%2215%22%20rx%3D%222.2%22%20fill%3D%22%23fff%22/%3E%3Crect%20x%3D%2212.5%22%20y%3D%2217.4%22%20width%3D%2215%22%20height%3D%225.2%22%20rx%3D%222.2%22%20fill%3D%22%23fff%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F8F6;--surface:#FFFFFF;--surface-2:#FBFBF9;
    --ink:#15201A;--muted:#5A655E;--faint:#8A958E;
    --brand:#10A06A;--brand-dark:#0A7048;--brand-soft:#E5F4EC;--brand-tint:#EFF8F2;
    --accent:#E76A47;--accent-soft:#FCEEE7;--good:#10A06A;--bad:#E05A3E;
    --line:rgba(21,32,26,0.08);--line-2:rgba(21,32,26,0.14);
    --radius:20px;--radius-lg:26px;--radius-sm:13px;
    --shadow-sm:0 1px 2px rgba(21,32,26,.04);
    --shadow:0 1px 3px rgba(21,32,26,.05),0 16px 40px -26px rgba(21,32,26,.30);
    --shadow-lg:0 2px 8px rgba(21,32,26,.05),0 34px 64px -34px rgba(21,32,26,.34);
    --display:"Plus Jakarta Sans",system-ui,sans-serif;--body:"Inter",system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.05;margin:0;letter-spacing:-0.025em;}
  button{font-family:inherit;cursor:pointer;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px;}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}
  :focus-visible{outline:2.5px solid var(--brand-dark);outline-offset:3px;border-radius:8px;}

  .topbar{position:sticky;top:0;z-index:50;background:rgba(247,248,246,0.78);backdrop-filter:saturate(150%) blur(16px);-webkit-backdrop-filter:saturate(150%) blur(16px);border-bottom:1px solid var(--line);}
  .topbar .wrap{display:flex;align-items:center;gap:14px;padding:14px 24px;}
  .brandmark{display:flex;align-items:center;gap:11px;font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-0.03em;color:var(--ink);background:none;border:none;padding:0;}
  .brandmark .dot{width:32px;height:32px;display:flex;align-items:center;justify-content:center;}
  .spacer{flex:1;}
  .navlink{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);font-size:13.5px;font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow-sm);transition:.18s;margin-right:4px;}
  .navlink:hover{border-color:var(--brand);color:var(--brand-dark);}
  .lang{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--shadow-sm);}
  .lang button{border:none;background:none;color:var(--muted);font-size:13px;font-weight:600;padding:6px 14px;border-radius:999px;transition:.18s;}
  .lang button.on{background:var(--ink);color:#fff;}

  .protobar{text-align:center;font-size:12px;padding:10px 24px 4px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:var(--faint);}
  .protobar:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:middle;}

  .hero{text-align:center;padding:72px 0 12px;}
  .hero h1{font-size:clamp(40px,6.4vw,66px);font-weight:700;letter-spacing:-0.045em;margin-bottom:18px;}
  .hero p{font-size:19px;color:var(--muted);margin:0 auto;max-width:520px;line-height:1.5;}
  .searchwrap{max-width:660px;margin:38px auto 0;position:relative;z-index:20;}
  .searchwrap input{width:100%;height:66px;border-radius:20px;border:1px solid var(--line-2);background:var(--surface);padding:0 26px 0 60px;font-size:18px;font-family:inherit;color:var(--ink);box-shadow:var(--shadow);transition:border-color .18s,box-shadow .18s,transform .18s;}
  .searchwrap input::placeholder{color:var(--faint);}
  .searchwrap input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft),var(--shadow);}
  .searchwrap .mag{position:absolute;left:23px;top:50%;transform:translateY(-50%);color:var(--faint);display:flex;pointer-events:none;}
  .sugg{position:absolute;left:0;right:0;top:calc(100% + 10px);background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);padding:7px;display:none;text-align:left;}
  .sugg.open{display:block;}
  .sg-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 15px;border-radius:13px;cursor:pointer;transition:background .14s;}
  .sg-item:hover,.sg-item.act{background:var(--brand-tint);}
  .sg-main{display:flex;align-items:center;gap:11px;min-width:0;}
  .sg-name{font-weight:600;font-size:15.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sg-price{font-family:var(--display);font-weight:700;color:var(--brand-dark);font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .sg-price i{font-style:normal;font-size:11px;color:var(--faint);font-weight:600;margin-left:5px;}
  .sg-empty{padding:20px 16px;color:var(--muted);font-size:14px;text-align:center;}
  .controls{max-width:660px;margin:18px auto 0;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;}
  .toggle{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;box-shadow:var(--shadow-sm);}
  .toggle button{border:none;background:none;font-size:14px;font-weight:600;color:var(--muted);padding:10px 18px;border-radius:10px;transition:.18s;}
  .toggle button.on{background:var(--ink);color:#fff;}
  .selwrap{position:relative;}
  select{appearance:none;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 40px 13px 18px;cursor:pointer;box-shadow:var(--shadow-sm);transition:.18s;}
  select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft);}
  .selwrap .chev{position:absolute;right:16px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted);font-size:12px;}
  .popular{max-width:660px;margin:24px auto 0;text-align:center;}
  .popular .lbl{font-size:13px;color:var(--faint);font-weight:600;margin-right:6px;}
  .chip{display:inline-block;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 17px;font-size:14px;font-weight:600;margin:5px 4px;color:var(--ink);transition:.18s;box-shadow:var(--shadow-sm);}
  .chip:hover{border-color:var(--brand);color:var(--brand-dark);transform:translateY(-2px);}

  .browse{margin:64px 0 72px;}
  .browse .sec-lbl{text-align:center;font-size:12px;font-weight:700;color:var(--faint);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:28px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:16px;}
  .cat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px;text-align:left;transition:transform .2s cubic-bezier(.2,.7,.2,1),border-color .2s,box-shadow .2s;opacity:0;animation:cardIn .55s cubic-bezier(.2,.7,.2,1) forwards;}
  .cat:hover{transform:translateY(-5px);border-color:var(--line-2);box-shadow:var(--shadow);}
  .cat .ic{width:52px;height:52px;border-radius:16px;background:var(--brand-tint);color:var(--brand-dark);display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:18px;transition:.2s;}
  .cat:hover .ic{background:var(--brand);color:#fff;transform:scale(1.04);}
  .cat h3{font-family:var(--body);font-size:17px;font-weight:700;letter-spacing:-0.01em;margin-bottom:5px;}
  .cat p{font-size:14px;color:var(--muted);margin:0;}
  .skel{height:158px;border-radius:var(--radius);background:linear-gradient(100deg,#e9ece8 28%,#f4f6f2 50%,#e9ece8 72%);background-size:220% 100%;animation:shimmer 1.3s linear infinite;}

  .backbtn{display:inline-flex;align-items:center;gap:7px;background:none;border:none;color:var(--brand-dark);font-size:15px;font-weight:600;padding:30px 0 8px;transition:gap .18s;}
  .backbtn:hover{gap:12px;}
  .list-head{padding:8px 0 20px;border-bottom:1px solid var(--line);margin-bottom:24px;}
  .list-head h1{font-size:clamp(28px,4vw,38px);letter-spacing:-0.035em;}
  .list-head .meta{color:var(--muted);font-size:15px;margin-top:8px;}

  .svclist{display:flex;flex-direction:column;gap:12px;}
  .svc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;width:100%;text-align:left;transition:transform .18s cubic-bezier(.2,.7,.2,1),border-color .18s,box-shadow .18s;opacity:0;animation:cardIn .55s cubic-bezier(.2,.7,.2,1) forwards;}
  .svc:hover{transform:translateY(-3px);border-color:var(--line-2);box-shadow:var(--shadow);}
  .svc h3{font-family:var(--body);font-size:17px;font-weight:700;letter-spacing:-0.01em;margin-bottom:7px;}
  .svc .code{display:inline-block;background:var(--ink);color:#fff;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:7px;letter-spacing:0.02em;font-variant-numeric:tabular-nums;}
  .svc .from{text-align:right;white-space:nowrap;}
  .svc .from .v{font-family:var(--display);font-size:23px;font-weight:700;letter-spacing:-0.03em;color:var(--brand-dark);font-variant-numeric:tabular-nums;}
  .svc .from small{display:block;font-size:11.5px;color:var(--faint);font-weight:600;}

  .res-head{padding:8px 0 22px;border-bottom:1px solid var(--line);margin-bottom:26px;}
  .res-head h1{font-size:clamp(30px,4.2vw,42px);letter-spacing:-0.04em;margin-bottom:10px;}
  .res-head .meta{color:var(--muted);font-size:15px;}
  .res-head .code{display:inline-block;background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:4px 11px;border-radius:8px;margin-left:10px;vertical-align:middle;letter-spacing:0.02em;font-variant-numeric:tabular-nums;}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px;}
  .stat{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:18px 20px;}
  .stat .k{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:0.04em;text-transform:uppercase;}
  .stat .v{font-family:var(--display);font-size:31px;font-weight:700;letter-spacing:-0.035em;margin-top:5px;font-variant-numeric:tabular-nums;}
  .stat.lo .v{color:var(--good);} .stat.hi .v{color:var(--bad);}
  .savecard{display:flex;align-items:center;gap:17px;background:var(--brand-tint);border:1px solid var(--brand-soft);border-radius:var(--radius);padding:18px 24px;margin-bottom:28px;}
  .savecard .ic{width:46px;height:46px;border-radius:14px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
  .savecard .s-big{font-family:var(--display);font-size:29px;font-weight:700;color:var(--brand-dark);letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums;}
  .savecard .s-lbl{font-size:13.5px;color:var(--brand-dark);margin-top:5px;opacity:.92;line-height:1.4;}
  .res-controls{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;margin-bottom:20px;}
  .ctrl-grp{display:flex;align-items:center;gap:10px;}
  .ctrl-lbl{font-size:11.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.1em;}
  .seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;box-shadow:var(--shadow-sm);}
  .seg button{border:none;background:none;font-size:13.5px;font-weight:600;color:var(--muted);padding:8px 15px;border-radius:9px;transition:.16s;}
  .seg button.on{background:var(--ink);color:#fff;}
  .provlist{display:flex;flex-direction:column;gap:14px;}
  .prov{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;text-align:left;transition:transform .18s cubic-bezier(.2,.7,.2,1),border-color .18s,box-shadow .18s;width:100%;opacity:0;animation:cardIn .55s cubic-bezier(.2,.7,.2,1) forwards;}
  .prov:hover{transform:translateY(-3px);border-color:var(--line-2);box-shadow:var(--shadow);}
  .prov .row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;}
  .prov h3{font-family:var(--body);font-size:18px;font-weight:700;letter-spacing:-0.01em;margin-bottom:8px;}
  .prov .sub{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .badge{font-size:12px;font-weight:600;padding:4px 11px;border-radius:8px;}
  .badge.hosp{background:#EDF0EE;color:#4a5650;} .badge.out{background:var(--brand-soft);color:var(--brand-dark);} .badge.best{background:var(--ink);color:#fff;}
  .prov .price{font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:-0.035em;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .prov .price.lo{color:var(--good);} .prov .price.hi{color:var(--bad);}
  .prov .price small{display:block;font-family:var(--body);font-size:12px;font-weight:600;color:var(--faint);margin-top:3px;font-variant-numeric:tabular-nums;}
  .bar{position:relative;height:6px;border-radius:99px;background:var(--line);margin-top:22px;}
  .bar i{display:block;height:6px;border-radius:99px;background:var(--brand);position:relative;transition:width .55s cubic-bezier(.2,.7,.2,1);}
  .bar i::after{content:"";position:absolute;right:0;top:50%;width:14px;height:14px;border-radius:50%;background:var(--brand);border:3px solid var(--surface);transform:translate(50%,-50%);box-shadow:0 1px 4px rgba(21,32,26,.28);}
  .bar i.lo,.bar i.lo::after{background:var(--good);} .bar i.hi,.bar i.hi::after{background:var(--bad);}
  .gocue{font-size:13px;color:var(--brand-dark);font-weight:600;margin-top:18px;display:flex;align-items:center;gap:5px;opacity:.9;}
  .emptyrow{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:32px 26px;text-align:center;color:var(--muted);font-size:15px;}

  .det-head{padding:8px 0 26px;}
  .det-head h1{font-size:clamp(28px,4vw,40px);letter-spacing:-0.04em;margin-bottom:10px;}
  .det-head .meta{color:var(--muted);font-size:15px;}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:30px 32px;margin-bottom:18px;box-shadow:var(--shadow-sm);}
  .panel h2{font-size:23px;letter-spacing:-0.03em;margin-bottom:7px;}
  .panel .lede{color:var(--muted);font-size:15px;margin:0 0 24px;}
  .pricetag{font-family:var(--display);font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-0.03em;font-variant-numeric:tabular-nums;}
  .slider{display:flex;align-items:center;gap:18px;margin-bottom:20px;}
  .slider label{font-size:15px;color:var(--muted);font-weight:500;width:210px;}
  .slider input[type=range]{flex:1;accent-color:var(--brand);height:6px;}
  .slider .out{font-family:var(--display);font-size:17px;font-weight:700;width:78px;text-align:right;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;}
  .estbox,.cashbox{background:var(--ink);border-radius:var(--radius);padding:30px;text-align:center;margin-top:8px;}
  .estbox .k,.cashbox .k{font-size:13px;color:rgba(255,255,255,0.58);font-weight:600;letter-spacing:0.04em;text-transform:uppercase;}
  .estbox .v{font-family:var(--display);font-size:56px;font-weight:700;color:#fff;line-height:1.02;margin:8px 0 5px;letter-spacing:-0.045em;font-variant-numeric:tabular-nums;}
  .estbox .bd{font-size:13px;color:rgba(255,255,255,0.6);font-variant-numeric:tabular-nums;}
  .cashbox .v{font-family:var(--display);font-size:56px;font-weight:700;color:#7FE3B0;margin:8px 0 5px;letter-spacing:-0.045em;font-variant-numeric:tabular-nums;}
  .ask{list-style:none;padding:0;margin:0;}
  .ask li{display:flex;gap:14px;align-items:flex-start;padding:15px 0;border-bottom:1px solid var(--line);font-size:15.5px;}
  .ask li:last-child{border-bottom:none;}
  .ask .q{width:27px;height:27px;border-radius:50%;background:var(--brand-tint);color:var(--brand-dark);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
  .qual{display:flex;gap:14px;align-items:flex-start;background:var(--brand-tint);border-radius:var(--radius-sm);padding:22px 24px;}
  .qual .ic{width:31px;height:31px;border-radius:50%;background:var(--brand);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .qual p{margin:0;color:var(--brand-dark);font-size:15.5px;}
  .note{font-size:13px;color:var(--faint);line-height:1.6;margin-top:18px;display:flex;gap:8px;}
  .errbar{background:var(--accent-soft);color:#8a3d1f;border-radius:16px;padding:18px 22px;font-size:14px;font-weight:600;line-height:1.5;max-width:660px;margin:26px auto;}
  .footer{text-align:center;color:var(--faint);font-size:13px;padding:44px 0 64px;}

  .hidden{display:none;}
  .reveal{animation:viewIn .5s cubic-bezier(.2,.7,.2,1);}
  @keyframes viewIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
  @keyframes cardIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
  @keyframes shimmer{from{background-position:220% 0;}to{background-position:-220% 0;}}
  .cat:nth-child(1),.prov:nth-child(1),.svc:nth-child(1){animation-delay:.02s;}
  .cat:nth-child(2),.prov:nth-child(2),.svc:nth-child(2){animation-delay:.05s;}
  .cat:nth-child(3),.prov:nth-child(3),.svc:nth-child(3){animation-delay:.08s;}
  .cat:nth-child(4),.prov:nth-child(4),.svc:nth-child(4){animation-delay:.11s;}
  .cat:nth-child(5),.prov:nth-child(5),.svc:nth-child(5){animation-delay:.14s;}
  .cat:nth-child(6),.prov:nth-child(6),.svc:nth-child(6){animation-delay:.17s;}
  .prov:nth-child(n+7),.svc:nth-child(n+7){animation-delay:.20s;}
  @media(max-width:620px){
    .hero{padding:52px 0 8px;} .stats{grid-template-columns:1fr;}
    .slider label{width:140px;font-size:14px;} .slider{gap:12px;}
    .prov .price{font-size:24px;} .estbox .v,.cashbox .v{font-size:44px;} .panel{padding:24px 22px;}
    .res-controls{gap:12px;} .ctrl-grp{width:100%;justify-content:space-between;}
  }
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}.cat,.prov,.svc{opacity:1!important;}}


  .chat-fab{position:fixed;right:22px;bottom:22px;width:58px;height:58px;border-radius:50%;background:var(--brand);color:#fff;border:none;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-lg);z-index:60;transition:transform .18s,background .18s;}
  .chat-fab:hover{transform:translateY(-2px) scale(1.03);background:var(--brand-dark);}
  .chat-panel{position:fixed;right:22px;bottom:22px;width:382px;max-width:calc(100vw - 32px);height:564px;max-height:calc(100vh - 96px);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);z-index:61;display:none;flex-direction:column;overflow:hidden;}
  .chat-panel.open{display:flex;animation:chatIn .26s cubic-bezier(.2,.7,.2,1);}
  @keyframes chatIn{from{opacity:0;transform:translateY(16px) scale(.98);}to{opacity:1;transform:none;}}
  .chat-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);}

function renderLoading(){

function svcLowest(id){
  let rows=DATA[id].filter(p=>region==="all"||p[1]===region);

  return Math.min(...rows.map(p=>p[idx]));
}

/* ---- live search suggestions ---- */
function matchIds(q){
  q=q.trim().toLowerCase();
  if(!q) return [];
  return ORDER.filter(id=>SERVICES[id].name[lang].toLowerCase().includes(q)||
    SERVICES[id].name.en.toLowerCase().includes(q)||SERVICES[id].code.toLowerCase().includes(q));
}
function runSugg(q){
  if(!ORDER.length||!q.trim()){closeSugg();return;}
  suggMatches=matchIds(q).slice(0,6);suggIdx=-1;renderSugg();
}
function renderSugg(){
  const t=T[lang],el=$("sugg");
  if(!suggMatches.length){
    el.innerHTML=`<div class="sg-empty">${t.searchNo}</div>`;
  }else{
    el.innerHTML=suggMatches.map((id,i)=>{
      const s=SERVICES[id];
      return `<div class="sg-item${i===suggIdx?' act':''}" role="option" aria-selected="${i===suggIdx}" onmousedown="pickSugg(${i})"><div class="sg-main"><span class="sg-name">${s.name[lang]}</span><span class="code">${s.code}</span></div><span class="sg-price">${money(svcLowest(id))}<i>${t.from}</i></span></div>`;
    }).join("");
  }
  el.classList.add("open");$("search").setAttribute("aria-expanded","true");
}
function closeSugg(){
  $("sugg").classList.remove("open");$("sugg").innerHTML="";
  $("search").setAttribute("aria-expanded","false");suggMatches=[];suggIdx=-1;
}
function pickSugg(i){const id=suggMatches[i];if(id){closeSugg();$("search").blur();openService(id,"home");}}

function openCategory(cat){
  const t=T[lang];
  if(cat==="all"){listIds=ORDER.slice();listTitle=t.allServices;}
  else{listIds=ORDER.filter(id=>SERVICES[id].cat===cat);
       const c=CATS.find(x=>x.id===cat);listTitle=c?c[lang][0]:cat;}
  showList();
}
function openSearch(q){
  const t=T[lang];q=q.trim().toLowerCase();
  if(!q){openCategory("all");return;}
  const m=matchIds(q);
  if(m.length===1){openService(m[0],"home");return;}
  if(m.length>1){listIds=m;listTitle=`${t.resultsFor} \u201C${q}\u201D`;showList();return;}
  listIds=ORDER.slice();listTitle=t.noMatch;showList();
}

  $("svc-list").innerHTML=listIds.map(id=>{
    const s=SERVICES[id];
    return `<button class="svc" onclick="openService('${id}','list')"><div><h3>${s.name[lang]}</h3><span class="code">${s.code}</span></div><div class="from"><div class="v">${money(svcLowest(id))}</div><small>${t.from}</small></div></button>`;
  }).join("");
  show("view-list");
}
function buildList(){
  let list=DATA[curService].filter(p=>region==="all"||p[1]===region);
  if(!list.length) list=DATA[curService].slice();
  if(resFilter!=="all") list=list.filter(p=>p[2]===resFilter);
  const idx=mode==="ins"?4:5;
  if(resSort==="dist") list.sort((a,b)=>a[3]-b[3]);
  else if(resSort==="name") list.sort((a,b)=>a[0].localeCompare(b[0]));
  else list.sort((a,b)=>a[idx]-b[idx]);
  curList=list;
}
function openService(id,from){

function renderResControls(){

  $("res-controls").innerHTML=
    seg({lbl:t.sortLbl},[
      {t:t.sortPrice,on:resSort==="price",fn:"setSort('price')"},
      {t:t.sortDist,on:resSort==="dist",fn:"setSort('dist')"},
      {t:t.sortName,on:resSort==="name",fn:"setSort('name')"}])+
    seg({lbl:t.filtLbl},[
      {t:t.filtAll,on:resFilter==="all",fn:"setFilter('all')"},

function renderResults(){

  $("res-meta").textContent=`${curList.length} ${t.near} \u00B7 ${REGION_NAMES[lang][region]} \u00B7 ${mode==="ins"?t.ins:t.cash}`;

    $("res-stats").innerHTML="";$("res-save").innerHTML="";

    $("res-note").innerHTML="\u24D8&nbsp; "+(mode==="ins"?t.resNote:t.resNoteCash);
    return;
  }
  const prices=curList.map(p=>p[idx]);
  const lo=Math.min(...prices),hi=Math.max(...prices);
  const med=prices.slice().sort((a,b)=>a-b)[Math.floor(prices.length/2)];
  $("res-stats").innerHTML=`<div class="stat lo"><div class="k">${t.lowest}</div><div class="v">${money(lo)}</div></div><div class="stat"><div class="k">${t.median}</div><div class="v">${money(med)}</div></div><div class="stat hi"><div class="k">${t.highest}</div><div class="v">${money(hi)}</div></div>`;
  const save=hi-lo;
  $("res-save").innerHTML = (save>0&&curList.length>1)
    ? `<div class="savecard"><span class="ic">\u2193</span><div><div class="s-big">${money(save)}</div><div class="s-lbl">${t.saveCap}</div></div></div>` : "";
  $("res-list").innerHTML=curList.map((p,i)=>{
    const price=p[idx],alt=mode==="ins"?p[5]:p[4];
    const pct=Math.max(6,Math.round((price/hi)*100));

    const tb=p[2]==="out"?`<span class="badge out">${t.outp}</span>`:`<span class="badge hosp">${t.hospital}</span>`;
    const bb=isLo?`<span class="badge best">${t.cheapest}</span>`:"";

    return `<button class="prov" onclick="openProvider(${i})"><div class="row"><div><h3>${p[0]}</h3><div class="sub">${tb} ${bb} <span>\u00B7 ${p[3]} mi</span></div></div><div class="price ${cls}">${money(price)}<small>${al} ${money(alt)}</small></div></div><div class="bar"><i class="${cls}" style="width:${pct}%"></i></div><div class="gocue">${t.goCue} \u203A</div></button>`;
  }).join("");
  $("res-note").innerHTML="\u24D8&nbsp; "+(mode==="ins"?t.resNote:t.resNoteCash);
}

function wireEst(price){
  const t=T[lang],ded=$("ded"),coin=$("coin");
  function c(){
    const d=+ded.value,cc=+coin.value/100;
    $("ded-out").textContent=money(d);$("coin-out").textContent=Math.round(cc*100)+"%";
    const tw=Math.min(d,price),af=Math.max(0,price-d),cp=af*cc,tot=tw+cp;
    $("oop").textContent=money(tot);
    $("bd").textContent=af>0?`${money(tw)} ${t.towardDed} + ${money(cp)} ${t.coins}`:t.fullDed;
  }
  ded.addEventListener("input",c);coin.addEventListener("input",c);c();
}

const searchEl=$("search");
searchEl.addEventListener("input",e=>runSugg(e.target.value));
searchEl.addEventListener("focus",e=>{if(e.target.value.trim())runSugg(e.target.value);});
searchEl.addEventListener("keydown",e=>{
  if(suggMatches.length&&(e.key==="ArrowDown"||e.key==="ArrowUp")){
    e.preventDefault();
    suggIdx=e.key==="ArrowDown"?(suggIdx+1)%suggMatches.length:(suggIdx-1+suggMatches.length)%suggMatches.length;
    renderSugg();return;
  }
  if(e.key==="Enter"){
    if(suggIdx>=0&&suggMatches[suggIdx]){pickSugg(suggIdx);}
    else{closeSugg();openSearch(e.target.value);}
  }
  if(e.key==="Escape"){closeSugg();}
});
searchEl.addEventListener("blur",()=>setTimeout(closeSugg,140));

const CHAT_STOP=new Set(["the","of","a","an","and","or","to","in","for","with","without","near","price","prices","cost","how","much","is","what","me","my","i","do","you","get","there","scan","de","la","el","los","las","un","una","y","o","en","con","sin","por","cerca","precio","precios","cuanto","cu\u00E1nto","que","es","del","para"]);
function chatTokens(str){
  var parts=str.toLowerCase().replace(/[^\p{L}\p{N} ]+/gu," ").split(/\s+/);
  var out=[],seen={};
  for(var i=0;i<parts.length;i++){var w=parts[i];if(w.length>=2&&!CHAT_STOP.has(w)&&!seen[w]){seen[w]=1;out.push(w);}}
  return out;
}
function chatScore(id,ql){
  var s=SERVICES[id],sc=0;
  if(ql.indexOf(s.code.toLowerCase())>=0) sc+=5;
  var toks=chatTokens(s.name.en+" "+s.name.es);
  for(var i=0;i<toks.length;i++){ if(ql.indexOf(toks[i])>=0) sc+=1; }
  return sc;
}
function chatAnswer(q){
  var C=CHAT[lang], ql=" "+q.toLowerCase()+" ";
  var m=mode;
  if(/cash|self ?pay|out of pocket|efectivo|sin seguro/.test(ql)) m="cash";
  else if(/insurance|insured|in ?network|con seguro|seguro/.test(ql)) m="ins";
  var r=region;
  var RM=[[/charleston|lowcountry|low country|musc/,"low"],[/greenville|spartanburg|upstate/,"up"],[/florence|pee dee|peedee/,"pd"],[/columbia|midlands|lexington/,"mid"],[/all of|south carolina|statewide|anywhere|everywhere|toda carolina/,"all"]];
  for(var i=0;i<RM.length;i++){ if(RM[i][0].test(ql)){ r=RM[i][1]; break; } }
  var scored=ORDER.map(function(id){return [id,chatScore(id,ql)];}).filter(function(a){return a[1]>0;}).sort(function(a,b){return b[1]-a[1];});
  if(!scored.length) return C.notFound(C.examples.slice(0,2).join(", "));
  var top=scored[0][1];
  var tied=scored.filter(function(a){return a[1]===top;}).map(function(a){return a[0];});
  if(tied.length>1 && top<5){
    var btns=tied.slice(0,5).map(function(id){return "<button class=\"chat-pill\" onclick=\"chatResolve('"+id+"')\">"+SERVICES[id].name[lang]+"</button>";}).join("");
    return "<p>"+C.didYouMean+"</p><div class=\"chat-pills\">"+btns+"</div>";
  }
  return chatReply(tied[0],ql,m,r);
}
function chatReply(id,ql,m,r){
  var C=CHAT[lang],s=SERVICES[id],idx=m==="ins"?4:5;
  var rows=DATA[id].filter(function(p){return r==="all"||p[1]===r;}),fell=false;
  if(!rows.length){ rows=DATA[id].slice(); fell=true; }
  var sorted=rows.slice().sort(function(a,b){return a[idx]-b[idx];});
  var loP=sorted[0],hiP=sorted[sorted.length-1];
  var lo=money(loP[idx]),hi=money(hiP[idx]);
  var rn=REGION_NAMES[lang][fell?"all":r],n=s.name[lang],mt=m==="ins"?C.modeIns:C.modeCash;
  var pre=fell?C.fell:"",html;
  if(/compare|list|options|show|every|all the|comparar|lista|opciones|todos|todas/.test(ql)){
    var lines=sorted.map(function(p){return "<div class=\"chat-li\"><span>"+p[0]+"</span><b class=\"num\">"+money(p[idx])+"</b></div>";}).join("");
    html="<p>"+pre+C.listIntro({n:n,mt:mt,rn:rn})+"</p><div class=\"chat-list\">"+lines+"</div>";
  }else{
    var body;
    if(/save|saving|ahorr/.test(ql) && loP!==hiP) body=C.save({n:n,mt:mt,rn:rn,save:money(hiP[idx]-loP[idx]),lo:lo,hi:hi,loProv:loP[0],hiProv:hiP[0]});
    else if(/highest|most expensive|priciest|m\u00E1s caro|mas caro|m\u00E1s alto|mas alto/.test(ql)) body=C.highest({n:n,mt:mt,rn:rn,hi:hi,hiProv:hiP[0]});
    else if(/cheap|lowest|least|best price|barat|m\u00E1s bajo|mas bajo|menor/.test(ql)) body=C.lowest({n:n,mt:mt,rn:rn,lo:lo,loProv:loP[0]});
    else body=C.summary({n:n,mt:mt,rn:rn,lo:lo,hi:hi,loProv:loP[0]});
    html="<p>"+pre+body+"</p>";
  }
  html+="<button class=\"chat-go\" onclick=\"chatGo('"+id+"')\">"+C.viewAll+" \u203A</button>";
  return html;
}
function chatResolve(id){ appendMsg("bot", chatReply(id,"",mode,region)); }
function chatGo(id){ closeChat(); openService(id,"home"); }
var chatStarted=false;
function appendMsg(role,html){ var d=document.createElement("div"); d.className="chat-msg "+role; d.innerHTML=html; var m=$("chat-msgs"); m.appendChild(d); m.scrollTop=m.scrollHeight; }
function chatGreet(){ var C=CHAT[lang]; var chips=C.examples.map(function(e){return "<button class=\"chat-pill\" onclick=\"chatExample(this)\">"+e+"</button>";}).join(""); $("chat-msgs").innerHTML=""; appendMsg("bot","<p>"+C.greeting+"</p><div class=\"chat-pills\">"+chips+"</div>"); chatStarted=true; }
function chatExample(el){ $("chat-in").value=el.textContent; chatSend(); }
function chatSend(){ var v=$("chat-in").value.trim(); if(!v) return; appendMsg("user","<p>"+v.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")+"</p>"); $("chat-in").value=""; appendMsg("bot", chatAnswer(v)); }
function chatToggle(){ var p=$("chat-panel"); var open=p.classList.toggle("open"); $("chat-fab").setAttribute("aria-expanded",open); if(open && !chatStarted) chatGreet(); if(open) setTimeout(function(){$("chat-in").focus();},60); }
function closeChat(){ $("chat-panel").classList.remove("open"); $("chat-fab").setAttribute("aria-expanded","false"); }
function renderChatChrome(){ var C=CHAT[lang]; $("chat-title").textContent=C.title; $("chat-in").placeholder=C.ph; $("chat-disc").textContent=C.disc; $("chat-fab").setAttribute("aria-label",C.title); if(chatStarted) chatGreet(); }
$("chat-send").addEventListener("click",chatSend);
$("chat-in").addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); chatSend(); } });
var _origRenderChrome=renderChrome;
renderChrome=function(){ _origRenderChrome(); renderChatChrome(); };

init();
</script>
</body>
</html>
